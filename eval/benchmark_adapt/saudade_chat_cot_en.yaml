task: saudade_chat_cot_en
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/eval/saudade_en_eval.jsonl
test_split: test
output_type: generate_until
doc_to_text: 'Question: {{prompt}}\nOptions:\n(A) {{facts_pair[0]}}\n(B) {{facts_pair[1]}}?\n\nChoose the correct option for the question above. Present your reasoning before answering. Finally, present your answer in the format \boxed{X}, where X is the letter of the correct option (A or B).'
doc_to_target: '{{"AB"[answer_index]}}'
num_fewshot: 0
generation_kwargs:
  max_gen_toks: 2048
  until:
  - "</s>"
  - "<|im_end|>"
  - "<|endoftext|>"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_punctuation: true
    ignore_case: true
filter_list:
- name: "answer-extractor"
  filter:
  - function: !function utils.ExtractAnswerR
  - function: "take_first"
metadata:
  version: 1.0
