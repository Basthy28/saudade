task: saudade_chat_en
dataset_path: json
dataset_kwargs:
  data_files:
    test: data/eval/saudade_en_eval.jsonl
test_split: test
output_type: generate_until
doc_to_text: 'Given the following question and two candidate answers (A and B), choose the correct answer.\nQuestion: {{prompt}}\nA. {{facts_pair[0]}}\nB. {{facts_pair[1]}}?\nYour response must end with "The best answer is [answer_letter]" where [answer_letter] is A or B.'
doc_to_target: '{{"AB"[answer_index] }}'
gen_prefix: 'The best answer is'
num_fewshot: 0
generation_kwargs:
  max_gen_toks: 100
  until:
    - "\n\n"
    - "."
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
filter_list:
  - name: remove_whitespace
    filter:
      - function: remove_whitespace
      - function: take_first
metadata:
  version: 1.0
